name: Version Check

on:
  pull_request:
    branches:
      - main


jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify shared version sync
        run: make version-check
