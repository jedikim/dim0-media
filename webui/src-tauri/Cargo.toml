[package]
name = "app"
version = "0.3.64"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.7.0", features = [] }
tauri-plugin-log = "2"
# BYOK relay: CORS-free HTTP from the webview straight to the user's provider.
tauri-plugin-http = "2"
# Local backend: SQLite via rusqlite (bundled) — one connection, real
# transactions. Chosen over the pooled sql plugin so multi-statement writes are
# genuinely atomic (see storage.rs).
rusqlite = { version = "0.32", features = ["bundled"] }
# System-browser Google OAuth (loopback + PKCE): a one-shot local server catches
# the redirect, `open` launches the default browser. See oauth.rs.
tiny_http = "0.12"
open = "5"
urlencoding = "2"
